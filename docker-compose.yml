# Streaming Panel local environment (R21).
# One-command backend stack: API + PostgreSQL + pgAdmin on a shared bridge network.
# Copy .env.example to .env and adjust values before `docker compose up`.

services:
  # ---- API container (R21.1) ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Connection string consumed as ConnectionStrings:Default by the API (R21.4).
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-streamingpanel};Username=${POSTGRES_USER:-app};Password=${DB_PASSWORD}"
      # JWT signing key (HMAC) used to sign access tokens.
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # Exact single allowed browser origin for CORS.
      Cors__FrontendOrigin: ${FRONTEND_ORIGIN:-http://localhost:4200}
      # Bounded startup DB connect/retry timeout in seconds (R21.4, R21.5).
      Database__ConnectTimeoutSeconds: ${DB_CONNECT_TIMEOUT_SECONDS:-60}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    # Expose the API on a configurable host port (R21.6); container always listens on 8080.
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    networks:
      - streaming-panel
    restart: unless-stopped

  # ---- PostgreSQL container (R21.2) ----
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamingpanel}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Persist data in a named volume so it survives container restarts (R21.7).
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Healthcheck lets the API wait until Postgres is actually ready to accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-streamingpanel}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - streaming-panel
    restart: unless-stopped

  # ---- pgAdmin container (R21.3) ----
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@streamingpanel.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - postgres
    # Expose pgAdmin on a configurable host port (R21.6); container listens on 80.
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      - streaming-panel
    restart: unless-stopped

# Named volumes: pgdata persists Postgres data across restarts (R21.7).
volumes:
  pgdata:
  pgadmin:

# Shared bridge network connecting all three services.
networks:
  streaming-panel:
    driver: bridge
